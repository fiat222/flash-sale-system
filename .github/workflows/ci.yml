name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js

  backend:
    needs: [commitlint]
    if: always() && (needs.commitlint.result == 'success' || needs.commitlint.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Check backend app exists
        id: exists
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/package.json not present yet — skipping lint/build/test"
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.found == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        if: steps.exists.outputs.found == 'true'
        run: npm ci

      - name: Lint
        if: steps.exists.outputs.found == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.exists.outputs.found == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.exists.outputs.found == 'true'
        run: npm test --if-present
