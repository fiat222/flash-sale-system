# One worker, matched to the container's 0.85 CPU limit (compose). `auto` would
# spawn one per host core (16 on the dev box) all contending for a single core's
# worth of quota.
worker_processes 1;
worker_rlimit_nofile 16384;

events {
    worker_connections 8192;
    multi_accept on;          # drain the whole accept queue per wakeup, not one conn at a time
}

http {
    upstream api {
        least_conn;
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        server api3:3000 max_fails=3 fail_timeout=10s;
        server api4:3000 max_fails=3 fail_timeout=10s;
        server api5:3000 max_fails=3 fail_timeout=10s;
        keepalive 160;              # ~32 idle conns per upstream (5 upstreams)
        keepalive_requests 10000;   # reuse each upstream conn longer (default 1000)
        keepalive_timeout 60s;
    }

    # --- diagnostic: log only slow requests (>=500ms) with upstream timing ---
    # Near-zero cost on the fast path; captures the timeout tail so we can see
    # whether the delay is in nginx (rt >> urt) or the node upstream (rt ~= urt).
    map $request_time $is_slow {
        default        1;
        "~^0\.[0-4]"   0;   # 0.000-0.499s -> not slow
        "~^0\.0"       0;
    }
    log_format slow '$time_iso8601 rt=$request_time urt=$upstream_response_time '
                    'ua=$upstream_addr us=$upstream_status status=$status "$request"';

    # Fastify's default keepAliveTimeout is 72s > our 60s upstream keepalive, so
    # nginx always closes idle upstream conns first — no half-open race.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 2s;     # a dead nest instance fails fast instead of hanging
    proxy_send_timeout   15s;
    proxy_read_timeout   15s;     # upstream response ceiling (was default 60s)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;  # try one other instance, then give up

    server {
        listen 80 backlog=4096;
        # No general access log (perf). Only the slow-request diagnostic below.
        # Read it with:  docker compose -f deploy/docker-compose.yml exec nginx cat /var/log/nginx/slow.log
        access_log /var/log/nginx/slow.log slow if=$is_slow;

        location / {
            proxy_pass http://api;
        }
    }
}
