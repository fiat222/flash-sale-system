# Runs on the openresty/openresty image (nginx + lua + lua-resty-redis).
# Two workers, matched to the container's CPU limit (compose). The read hot path
# is served from the proxy_cache below without ever touching a backend.
# root worker: single-purpose load-test container — lets the workers write the
# tmpfs proxy_cache dir and open the lua Redis cosocket freely.
user root;
worker_processes 3;
worker_rlimit_nofile 16384;

events {
    worker_connections 8192;
    multi_accept on;          # drain the whole accept queue per wakeup
}

http {
    upstream api {
        least_conn;
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        server api3:3000 max_fails=3 fail_timeout=10s;
        server api4:3000 max_fails=3 fail_timeout=10s;
        server api5:3000 max_fails=3 fail_timeout=10s;
        server api6:3000 max_fails=3 fail_timeout=10s;
        keepalive 160;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 2s;
    proxy_send_timeout   15s;
    proxy_read_timeout   15s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # --- edge cache for GET /api/v1/products ---------------------------------
    # keys_zone holds cache metadata; bodies live on disk (tmpfs in compose).
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=products:10m
                     max_size=64m inactive=30s use_temp_path=off;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    # docker embedded DNS — lua cosocket needs it to resolve "redis"
    resolver 127.0.0.11 ipv6=off valid=30s;

    # cache:ver is read from Redis at most once per second per worker and held
    # here — a live GET on every one of ~2,600 read req/s serialised the whole
    # read path behind the Redis cosocket pool (measured read p95 839ms). 1s of
    # version lag = the same invalidation-window class as the Redis cache-aside
    # itself; the edge body TTL below is the hard backstop.
    lua_shared_dict ver_cache 1m;

    # diagnostic: log only slow requests (>=500ms) with upstream + cache status
    map $request_time $is_slow {
        default        1;
        "~^0\.[0-4]"   0;
        "~^0\.0"       0;
    }
    log_format slow '$time_iso8601 rt=$request_time urt=$upstream_response_time '
                    'cache=$upstream_cache_status "$request"';

    server {
        listen 80 backlog=4096;
        access_log /var/log/nginx/slow.log slow if=$is_slow;

        # Read hot path. The cache key carries the invalidation version. The
        # worker DELetes cache:page:* then bumps cache:ver after each committed
        # deduction (spec 2.2); a new version => edge miss => rebuild from fresh
        # data. The version is memoised in ver_cache for 1s so the fast path is
        # pure nginx (tmpfs), no Redis round trip.
        location = /api/v1/products {
            set $cache_ver "0";
            access_by_lua_block {
                local cache = ngx.shared.ver_cache
                local ver = cache:get("v")
                if not ver then
                    local redis = require "resty.redis"
                    local red = redis:new()
                    red:set_timeouts(50, 50, 50)
                    if red:connect("redis", 6379) then
                        local v = red:get("cache:ver")
                        red:set_keepalive(10000, 100)
                        if v and v ~= ngx.null then ver = v end
                    end
                    ver = ver or "0"
                    cache:set("v", ver, 1)           -- 1s TTL
                end
                ngx.var.cache_ver = ver
            }

            proxy_pass http://api;
            proxy_cache products;
            proxy_cache_key "$uri?$args#v$cache_ver";
            proxy_cache_valid 200 10s;               # hard backstop if a version bump is ever missed
            proxy_cache_lock on;                     # one fill per key, the rest wait — no origin stampede
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache $upstream_cache_status always;
        }

        # Everything else (orders, auth, _metrics, health, admin) — no cache.
        location / {
            proxy_pass http://api;
        }
    }
}
