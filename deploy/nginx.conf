# Plain nginx reverse proxy / load balancer (least_conn) over the 6 api
# instances (lab 6). An nginx-tier HTTP edge cache was tried and removed pending
# a ruling on whether it counts as "in-memory caching" — caching now lives only
# in Redis (cache-aside, lab 4). Restore via git history if it is cleared.
# 2 workers — `auto` spawns one per host core (4) all contending for the
# container's fractional CPU quota, which just piles on CFS throttling.
worker_processes 2;
worker_rlimit_nofile 16384;

events {
    worker_connections 8192;
    multi_accept on;          # drain the whole accept queue per wakeup
}

http {
    upstream api {
        least_conn;
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        server api3:3000 max_fails=3 fail_timeout=10s;
        server api4:3000 max_fails=3 fail_timeout=10s;
        server api5:3000 max_fails=3 fail_timeout=10s;
        server api6:3000 max_fails=3 fail_timeout=10s;
        keepalive 160;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 2s;
    proxy_send_timeout   15s;
    proxy_read_timeout   15s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # diagnostic: log only slow requests (>=500ms) with upstream timing
    map $request_time $is_slow {
        default        1;
        "~^0\.[0-4]"   0;
        "~^0\.0"       0;
    }
    log_format slow '$time_iso8601 rt=$request_time urt=$upstream_response_time '
                    'ua=$upstream_addr us=$upstream_status status=$status "$request"';

    server {
        listen 80 backlog=4096;
        access_log /var/log/nginx/slow.log slow if=$is_slow;

        location / {
            proxy_pass http://api;
        }
    }
}
