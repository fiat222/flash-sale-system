# Auto-provisioned on Grafana start. Reads the same Postgres the app writes to.
apiVersion: 1

datasources:
  - name: flash-sale-postgres
    uid: flashsale-pg
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: ${POSTGRES_USER}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    isDefault: true
    editable: false
