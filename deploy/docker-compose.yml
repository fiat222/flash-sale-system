name: flash-sale-system

x-api-common: &api-common
  # CI publishes this on push (.github/workflows/publish-image.yml). On the VM
  # `docker compose pull` fetches it; `build:` is still here so a local
  # `docker compose up --build` keeps working without the registry.
  image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
  build:
    context: ../backend
    dockerfile: Dockerfile
    target: production
  env_file: .env
  environment:
    NODE_OPTIONS: ${NODE_OPTIONS}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  deploy:
    resources:
      limits:
        # 6 small instances (Node is single-threaded — scale OUT). VM is 4 vCPU /
        # 6 GiB. With the nginx edge cache removed, EVERY read request hits Node
        # again (cache-aside — 1 Redis GET), plus the 500-way POST /orders burst.
        # api is the bottleneck for both, so it gets the biggest slice:
        #   6*0.60 + nginx 0.45 + redis 0.60 + pg 0.25 + worker 0.35 = 5.25
        # ceilings (read/write peaks don't overlap — k6 writes start at 33s).
        # RE-CHECK with loadcap after the first run: on a 4-core box this is at
        # the edge, expect the top throttler to be api or redis.
        cpus: "0.60"
        memory: 424M

services:
  nginx:
    # Plain reverse proxy / load balancer (edge cache removed — see nginx.conf).
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/log/nginx:size=16m     # slow.log
    depends_on:
      - api1
      - api2
      - api3
      - api4
      - api5
      - api6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Pure proxy now (no cache work) — historically ~0.5 core at the
          # 1,000-VU read peak. 0.45; the freed core goes to api/redis.
          cpus: "0.45"
          memory: 128M

  api1:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api2:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api3:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api4:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api5:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api6:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: worker
      NODE_OPTIONS: ${NODE_OPTIONS}
    ports:
      - "${WORKER_PORT}:${WORKER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Drains ~50 jobs (concurrency 15) per write burst: one locked DB txn +
          # a product-page cache invalidation each. Affects queue backlog, not
          # POST latency.
          cpus: "0.35"
          memory: 384M

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=192MB
      -c max_connections=120
      -c work_mem=4MB
      -c synchronous_commit=off
    volumes:
      # postgres:18+ images store data under /var/lib/postgresql directly
      # (pg_ctlcluster-style layout) — mounting .../data breaks first boot.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Read path only hits postgres on a cold cache-aside miss (single-
          # flighted to one build per page); write path does ~50 short
          # pessimistic-locked txns in a tight burst.
          # max_connections=120 covers the pool worst case:
          # 6 api * POSTGRES_POOL_API(8) + worker * POSTGRES_POOL_WORKER(20) = 68.
          cpus: "0.25"
          memory: 512M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Hot paths: (1) one cache-aside GET per read request (~5-6k GET/s at
          # the read peak — up now that the edge cache is gone), (2) the Lua
          # claim + BullMQ enqueue for all 500 concurrent writes. 0.60.
          cpus: "0.60"
          memory: 512M

volumes:
  postgres-data:
  redis-data: