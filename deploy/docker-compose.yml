name: flash-sale-system

x-api-common: &api-common
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file: .env
  environment:
    NODE_OPTIONS: ${NODE_OPTIONS}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "0.65"
        memory: 350M

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  api1:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api2:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api3:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: worker
      NODE_OPTIONS: ${NODE_OPTIONS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=192MB
      -c max_connections=60
      -c work_mem=4MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 900M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 350M

volumes:
  postgres-data:
  redis-data:
