name: flash-sale-system

x-api-common: &api-common
  # CI publishes this on push (.github/workflows/publish-image.yml). On the VM
  # `docker compose pull` fetches it; `build:` is still here so a local
  # `docker compose up --build` keeps working without the registry.
  image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
  build:
    context: ../backend
    dockerfile: Dockerfile
    target: production
  env_file: .env
  environment:
    NODE_OPTIONS: ${NODE_OPTIONS}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  deploy:
    resources:
      limits:
        # 6 small instances (Node is single-threaded — scale OUT). VM is 4 vCPU
        # / 6 GiB. Measured: with the nginx edge cache serving 100% of the read
        # plateau the box sits at ~65% idle during reads and the api tier barely
        # throttles (<1s / 45s). The real load is now the 500-way write burst
        # (api claim + queue), so the budget shifts to the WRITE path:
        #   6*0.35 + nginx 1.00 + redis 0.60 + pg 0.45 + worker 0.55 = 4.70.
        cpus: "0.35"
        memory: 424M

services:
  nginx:
    # openresty = nginx + lua + lua-resty-redis (nginx.conf reads cache:ver
    # from Redis per request to version the edge cache key).
    image: openresty/openresty:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:size=96m,mode=1777   # cache bodies in RAM
      - /var/log/nginx:size=16m,mode=1777     # slow.log
    depends_on:
      - api1
      - api2
      - api3
      - api4
      - api5
      - api6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Serves the ENTIRE read plateau from its own cache (2 workers) + one
          # lua Redis GET per request for the version key. Measured ~0.7s throttle
          # / 45s at 1.30, so 1.00 is ample and the core goes to the write path.
          cpus: "1.00"
          memory: 192M

  api1:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api2:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api3:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api4:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api5:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api6:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: worker
      NODE_OPTIONS: ${NODE_OPTIONS}
    ports:
      - "${WORKER_PORT}:${WORKER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Drains ~50 jobs (concurrency 15) per write burst: DB txn + DEL page
          # cache + INCR cache:ver each. Was throttled ~10.6s / 45s at 0.25 and
          # dragged write p95 past 800ms — bumped to 0.55. Idle during reads.
          cpus: "0.55"
          memory: 384M

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=192MB
      -c max_connections=120
      -c work_mem=4MB
      -c synchronous_commit=off
    volumes:
      # postgres:18+ images store data under /var/lib/postgresql directly
      # (pg_ctlcluster-style layout) — mounting .../data breaks first boot.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Read path never touches postgres (served from the edge cache); write
          # path does ~50 short pessimistic-locked txns in a tight burst. Was
          # throttled ~3.3s / 45s at 0.25, so bumped to 0.45.
          # max_connections=120 covers the pool worst case:
          # 6 api * POSTGRES_POOL_API(8) + worker * POSTGRES_POOL_WORKER(20) = 68.
          cpus: "0.45"
          memory: 512M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Redis is now on THREE hot paths: (1) nginx lua GET cache:ver per
          # read request, (2) the page-cache GET on an edge miss, (3) the Lua
          # claim + BullMQ enqueue per write. Bumped 0.45 -> 0.60 for the extra
          # per-read version lookup the edge cache adds.
          cpus: "0.60"
          memory: 512M

volumes:
  postgres-data:
  redis-data: