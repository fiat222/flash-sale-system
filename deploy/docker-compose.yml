name: flash-sale-system

x-api-common: &api-common
  # CI publishes this on push (.github/workflows/publish-image.yml). On the VM
  # `docker compose pull` fetches it; `build:` is still here so a local
  # `docker compose up --build` keeps working without the registry.
  image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
  build:
    context: ../backend
    dockerfile: Dockerfile
    target: production
  env_file: .env
  environment:
    NODE_OPTIONS: ${NODE_OPTIONS}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  deploy:
    resources:
      limits:
        # api is the CPU bottleneck for BOTH phases (throttle counters: api ~80s
        # vs redis ~0.4s). Node is single-threaded, so we scale OUT to 5 smaller
        # instances instead of 3 bigger ones — 5 event loops absorb the 500-way
        # concurrent write spike better at ~the same total budget (5*0.45=2.25).
        cpus: "0.45"
        memory: 350M

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
      - api4
      - api5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Single nginx worker (see nginx.conf). At 0.5 it was CFS-throttled
          # ~99% at the 1,000-VU read peak (nr_throttled 3167). 0.85 clears the
          # throttle with headroom (measured ~0.82 core at peak). Budget comes
          # from postgres, which is fully idle on the read path (0.75->0.4).
          cpus: "0.85"
          memory: 64M

  api1:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api2:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api3:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api4:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api5:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: worker
      NODE_OPTIONS: ${NODE_OPTIONS}
    ports:
      - "${WORKER_PORT}:${WORKER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Drains ~50 jobs (concurrency 15) per write burst; 0.4 is ample.
          cpus: "0.4"
          memory: 300M

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=192MB
      -c max_connections=60
      -c work_mem=4MB
    volumes:
      # postgres:18+ images store data under /var/lib/postgresql directly
      # (pg_ctlcluster-style layout) — mounting .../data breaks first boot.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Read path never touches postgres (served fully from L1/L2 cache);
          # write path only does ~50 short locked txns. 0.35 is ample.
          cpus: "0.35"
          memory: 900M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Measured: redis throttle is negligible (nr_throttled ~23,
          # throttled_usec ~0.4s) even at 0.4 — it is NOT the write bottleneck.
          # 0.45 keeps a small margin; the reclaimed budget goes to the api tier.
          cpus: "0.45"
          memory: 350M

volumes:
  postgres-data:
  redis-data:
