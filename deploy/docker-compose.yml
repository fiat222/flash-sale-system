name: flash-sale-system

x-api-common: &api-common
  # CI publishes this on push (.github/workflows/publish-image.yml). On the VM
  # `docker compose pull` fetches it; `build:` is still here so a local
  # `docker compose up --build` keeps working without the registry.
  image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
  build:
    context: ../backend
    dockerfile: Dockerfile
    target: production
  env_file: .env
  environment:
    NODE_OPTIONS: ${NODE_OPTIONS}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  deploy:
    resources:
      limits:
        # 6 small instances (Node is single-threaded — scale OUT). VM is 4 vCPU /
        # 6 GiB. The nginx edge cache serves 100% of the read plateau so the api
        # tier is idle during reads — but the 500-concurrent POST /orders burst
        # still lands fully on it (JWT verify + Redis claim + queue.add). Cutting
        # api to 0.35 pushed write p95 716 -> 1092ms, so it goes back to 0.50.
        #   6*0.50 + nginx 0.90 + redis 0.55 + pg 0.35 + worker 0.35 = 5.15
        # ceilings; read and write peaks don't overlap (k6 writes start at 33s).
        cpus: "0.50"
        memory: 424M

services:
  nginx:
    # openresty = nginx + lua + lua-resty-redis (nginx.conf reads cache:ver
    # from Redis per request to version the edge cache key).
    image: openresty/openresty:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:size=96m,mode=1777   # cache bodies in RAM
      - /var/log/nginx:size=16m,mode=1777     # slow.log
    depends_on:
      - api1
      - api2
      - api3
      - api4
      - api5
      - api6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Serves the ENTIRE read plateau from tmpfs (3 workers). Version key is
          # memoised in a lua_shared_dict (1s TTL) so there is no per-request
          # Redis round trip. At 0.90 it was the only container still throttling
          # (~9.4s / 45s) while the box sat ~78% idle — bumped to 1.80.
          cpus: "1.80"
          memory: 224M

  api1:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api2:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api3:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api4:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api5:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  api6:
    <<: *api-common
    environment:
      ROLE: api
      NODE_OPTIONS: ${NODE_OPTIONS}

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: worker
      NODE_OPTIONS: ${NODE_OPTIONS}
    ports:
      - "${WORKER_PORT}:${WORKER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Drains ~50 jobs (concurrency 15) per write burst: DB txn + DEL page
          # cache + INCR cache:ver each. Affects queue backlog, not the POST
          # latency. 0.35 keeps the drain up with the burst.
          cpus: "0.35"
          memory: 384M

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/fiat222/flash-sale-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=192MB
      -c max_connections=120
      -c work_mem=4MB
      -c synchronous_commit=off
    volumes:
      # postgres:18+ images store data under /var/lib/postgresql directly
      # (pg_ctlcluster-style layout) — mounting .../data breaks first boot.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Read path never touches postgres (served from the edge cache); write
          # path does ~50 short pessimistic-locked txns in a tight burst.
          # max_connections=120 covers the pool worst case:
          # 6 api * POSTGRES_POOL_API(8) + worker * POSTGRES_POOL_WORKER(20) = 68.
          cpus: "0.35"
          memory: 512M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Hot paths: (1) page-cache GET on an edge miss (rare — ~1/version),
          # (2) lua cache:ver refill ~1/s/worker, (3) the Lua claim + BullMQ
          # enqueue for all 500 concurrent writes. (3) dominates: 0.55.
          cpus: "0.55"
          memory: 512M

volumes:
  postgres-data:
  redis-data: